[package]
name = "workbench-cc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The agent-workbench command center: a Herdr plugin that joins Herdr, git and GitHub facts"
publish = false

[[bin]]
name = "workbench-cc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
wait-timeout = "0.2.1"

[dev-dependencies]
tempfile = "3.27.0"
