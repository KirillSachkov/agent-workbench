[package]
name = "workbench"
version = "0.1.0"
description = "Installs an agent-workbench harness into a project and keeps it in step"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.6"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = "1.1.6"
